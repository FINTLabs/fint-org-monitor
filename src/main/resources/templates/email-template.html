<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Organisasjonsendringer</title>
</head>
<body>
<div th:unless="${#lists.isEmpty(added)}">
    <h2>Følgende organisasjonselementer er nye:</h2>
    <ol>
        <li th:each="item: ${added}">
            <div th:insert="~{element::org(${item}, ${emptyChangedFields})}">...</div>
        </li>
    </ol>
</div>
<div th:unless="${#lists.isEmpty(removed)}">
    <h2>Følgende organisasjonselementer er fjernet:</h2>
    <ol>
        <li th:each="item: ${removed}">
            <div th:insert="~{element::org(${item}, ${emptyChangedFields})}">...</div>
        </li>
    </ol>
</div>
<div th:unless="${#lists.isEmpty(updated)}">
    <h2>Følgende organisasjonselementer er endret:</h2>
    <ol>
        <li th:each="item: ${updated}">
            <table>
                <thead>
                <tr>
                    <th>Før</th>
                    <th>Etter</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>
                        <div th:insert="~{element::org(${item.before}, ${emptyChangedFields})}">...</div>
                    </td>
                    <td>
                        <div th:insert="~{element::org(${item.after}, ${item.changedFieldNames})}">...</div>
                    </td>
                </tr>
                </tbody>
            </table>
        </li>
    </ol>
</div>
<div th:unless="${#lists.isEmpty(parentInfo)}">
    <h2>Overordnede organisasjonsenheter:</h2>
    <table>
    <tr>
        <th>Id</th>
        <th>Navn</th>
    </tr>
    <tr th:each="item: ${parentInfo}">
        <td th:text="${item.orgUnitId}">...</td>
        <td th:text="${item.orgUnitName}">...</td>
    </tr>
    </table>
</div>
<div th:unless="${#strings.isEmpty(organizationTree)}">
    <h2>Organisasjonstre:</h2>
    <pre style="font-family: monospace; white-space: pre-wrap;" th:text="${organizationTree}">...</pre>
</div>
</body>
</html>
