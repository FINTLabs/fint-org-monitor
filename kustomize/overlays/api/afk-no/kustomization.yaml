apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: afk-no
resources:
  - ../../../base
labels:
  - pairs:
      app.kubernetes.io/name: fint-org-monitor
      app.kubernetes.io/instance: fint-org-monitor_afk_no
      app.kubernetes.io/version: latest
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: fint-core
      fintlabs.no/team: core
      fintlabs.no/org-id: afk.no
patches:
  - patch: |-
      apiVersion: fintlabs.no/v1alpha1
      kind: Application
      metadata:
        name: fint-org-monitor
        labels:
          app.kubernetes.io/instance: fint-org-monitor_afk_no
      spec:
        orgId: afk.no
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-XX:+ExitOnOutOfMemoryError -XX:-UseBASE64Intrinsics"
          - name: fint.environment
            value: api
          - name: fint.orgmonitor.sender
            value: drift@vigoiks.no
          - name: fint.orgmonitor.recipients
            value: "integrasjoner.elements@afk.no, maritj@afk.no, birgerbra@frid-iks.no, digitale.skjema@frid-iks.no, daniel.johnsen@novari.no"
          - name: fint.orgmonitor.cron
            value: '0 0 8 * * MON-FRI'
    target:
      kind: Application
      name: fint-org-monitor

